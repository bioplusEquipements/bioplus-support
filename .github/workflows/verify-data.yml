name: Verify Data
on: workflow_dispatch
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Verify all data
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref bzodbqioldzdyupzoljx
          cat > /tmp/v.sql <<'EOSQL'
          SELECT 'LABORATOIRES' as t, count(*) as cnt FROM public.laboratoires;
          SELECT 'AUTOMATES' as t, count(*) as cnt FROM public.automates;
          SELECT 'PROFILES' as t, count(*) as cnt FROM public.profiles;
          SELECT 'TICKETS' as t, count(*) as cnt FROM public.tickets;
          SELECT 'AUTH_USERS' as t, count(*) as cnt FROM auth.users;
          SELECT email FROM auth.users LIMIT 5;
          SELECT user_id, role, full_name FROM public.profiles LIMIT 5;
          SELECT id, left(coalesce(description,''),60) as desc50, message_erreur, photo_path IS NOT NULL as has_photo FROM public.tickets LIMIT 5;
          EOSQL
          supabase db query --file /tmp/v.sql --linked
