name: Check RLS
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Dump policies
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref bzodbqioldzdyupzoljx
          cat > /tmp/q.sql <<'EOSQL'
          select tablename, policyname, cmd, permissive, left(qual::text,200) as qual, left(with_check::text,200) as with_check from pg_policies where tablename in ('tickets','automates','interventions','laboratoires') and schemaname='public' order by tablename, policyname;
          EOSQL
          supabase db query --file /tmp/q.sql --linked
