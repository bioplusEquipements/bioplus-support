name: Insert Real Tickets
on: workflow_dispatch
jobs:
  insert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Insert real test tickets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref bzodbqioldzdyupzoljx
          supabase db query --linked <<'EOSQL'
          INSERT INTO public.tickets
            (laboratoire_id, automate_id, numero_serie, message_erreur, code_erreur, description, photo_path, priorite, statut, technicien_id)
          VALUES
            ('c6ff24cd-56dc-48a4-add5-6d9d0a5fa50b', 'a627e47c-c7cc-4539-a309-ff0657db15a9', 'YUM-001',
             'WBC Clumped', '0x2A11',
             'Le compteur de globules blancs affiche une erreur WBC Clumped depuis ce matin. Les prelevements ont tous echoue. J''ai verifie le reactif et il est encore valable. Merci de intervenir rapidement.',
             'c6ff24cd-56dc-48a4-add5-6d9d0a5fa50b/test-photo-1.jpg',
             'important', 'ouvert', NULL),
            ('c6ff24cd-56dc-48a4-add5-6d9d0a5fa50b', 'a627e47c-c7cc-4539-a309-ff0657db15a9', 'YUM-001',
             'Erreur calibration', '0x1B03',
             'La machine ne parvient plus a se calibrer. Le level 1 est OK mais le level 2 echoue systematiquement depuis hier. Impossible de continuer les analyses.',
             NULL, 'critique', 'ouvert', NULL),
            ('c6ff24cd-56dc-48a4-add5-6d9d0a5fa50b', 'a627e47c-c7cc-4539-a309-ff0657db15a9', 'YUM-001',
             NULL, NULL,
             'L''aspirateur fait un bruit anormal et le debit est tres lent. Impossible de traiter plus de 10 echantillons d''affilee. Le bruit vient du compartiment reactifs.',
             NULL, 'normal', 'ouvert', NULL);
          EOSQL
          echo "=== VERIFY ==="
          supabase db query --linked <<'EOSQL'
          select count(*) as total_tickets from public.tickets;
          select id, left(description,50) as desc50, message_erreur, priorite, statut from public.tickets;
          EOSQL
