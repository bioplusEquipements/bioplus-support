name: Fix Tickets Detail Visibility
on: workflow_dispatch
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Fix automates RLS + verify tickets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref bzodbqioldzdyupzoljx
          cat > /tmp/fix.sql <<'EOSQL'
          -- 1. Dump all ticket policies with with_check column for diagnosis
          -- (this runs as postgres superuser, bypasses RLS)

          -- 2. Fix automates_select_member: add technicien
          drop policy if exists "automates_select_member" on public.automates;
          create policy "automates_select_member" on public.automates
            for select to authenticated
            using (
              public.is_member_of(laboratoire_id)
              or public."current_role"() in ('responsable', 'admin', 'technicien')
            );

          -- 3. Ensure tickets RLS is correct (admin+technician see all)
          -- tickets_select_member already has: is_member_of OR admin/technicien OR technicien_id = auth.uid()
          -- Verify by dumping:
          select policyname, cmd, qual::text as using_expr, with_check::text as check_expr
          from pg_policies
          where tablename in ('tickets', 'automates', 'interventions', 'messages')
            and schemaname = 'public'
          order by tablename, policyname;
          EOSQL
          supabase db query --file /tmp/fix.sql --linked
          echo "=== DONE ==="
