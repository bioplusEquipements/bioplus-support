name: Test API Access
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query tickets as service_role (bypasses RLS)
        env:
          SUPABASE_URL: https://bzodbqioldzdyupzoljx.supabase.co
        run: |
          SERVICE_KEY=$(curl -s -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" https://api.supabase.com/v1/projects/bzodbqioldzdyupzoljx/api-keys | jq '.[] | select(.name=="service_role") | .api_key' -r)
          
          echo "=== TICKETS WITH AUTOMATE JOIN (simulating admin view) ==="
          curl -s "$SUPABASE_URL/rest/v1/tickets?select=id,description,message_erreur,code_erreur,photo_path,priorite,statut,automates(nom,modele),technicien:profiles!tickets_technicien_id_fkey(full_name)" \
            -H "apikey: $SERVICE_KEY" \
            -H "Authorization: Bearer $SERVICE_KEY" | jq '.[] | {id: .id[0:8], description: (.description[0:80]), message_erreur, photo_path, priorite, statut, automate: .automates?.nom, technicien: .technicien?.full_name}'
