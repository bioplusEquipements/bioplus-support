name: Debug3
on: workflow_dispatch
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
      - name: Query via actual VITE_SUPABASE_URL
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          echo "=== PROJECT URL ==="
          echo "$VITE_SUPABASE_URL"
          # Extract project ref from URL
          PROJECT_REF=$(echo "$VITE_SUPABASE_URL" | sed 's|https://||' | sed 's|\.supabase\.co||')
          echo "=== PROJECT REF ==="
          echo "$PROJECT_REF"
          echo "=== TICKETS COUNT ==="
          curl -s "$VITE_SUPABASE_URL/rest/v1/tickets?select=*&limit=1" \
            -H "apikey: $VITE_SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $VITE_SUPABASE_ANON_KEY" | head -c 3000
          echo ""
          echo "=== PROFILES ==="
          curl -s "$VITE_SUPABASE_URL/rest/v1/profiles?select=user_id,role,full_name,laboratoire_id&limit=5" \
            -H "apikey: $VITE_SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $VITE_SUPABASE_ANON_KEY" | head -c 3000
          echo ""
          echo "=== AUTOMATES ==="
          curl -s "$VITE_SUPABASE_URL/rest/v1/automates?select=id,nom,laboratoire_id&limit=5" \
            -H "apikey: $VITE_SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $VITE_SUPABASE_ANON_KEY" | head -c 3000
