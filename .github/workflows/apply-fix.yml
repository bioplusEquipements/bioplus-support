name: Apply RLS Fix
on: workflow_dispatch
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply photos RLS fix
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref bzodbqioldzdyupzoljx
          cat > /tmp/fix.sql <<'EOSQL'
          drop policy if exists "photos_select_own_labo" on storage.objects;
          drop policy if exists "photos_insert_own_labo" on storage.objects;
          drop policy if exists "photos_update_own_labo" on storage.objects;
          drop policy if exists "photos_delete_own_labo" on storage.objects;
          create policy "photos_select_own_labo" on storage.objects for select to authenticated using (bucket_id='photos' and (public.is_member_of(public.uuid_or_null((storage.foldername(name))[1])) or public.current_role() in ('admin','technicien')));
          create policy "photos_insert_own_labo" on storage.objects for insert to authenticated with check (bucket_id='photos' and (public.is_member_of(public.uuid_or_null((storage.foldername(name))[1])) or public.current_role() in ('admin','technicien')));
          create policy "photos_update_own_labo" on storage.objects for update to authenticated using (bucket_id='photos' and (public.is_member_of(public.uuid_or_null((storage.foldername(name))[1])) or public.current_role() in ('admin','technicien'))) with check (bucket_id='photos' and (public.is_member_of(public.uuid_or_null((storage.foldername(name))[1])) or public.current_role() in ('admin','technicien')));
          create policy "photos_delete_own_labo" on storage.objects for delete to authenticated using (bucket_id='photos' and (public.is_member_of(public.uuid_or_null((storage.foldername(name))[1])) or public.current_role() in ('admin','technicien')));
          EOSQL
          supabase db execute --file /tmp/fix.sql --project-ref bzodbqioldzdyupzoljx
          echo "Fix applied"
