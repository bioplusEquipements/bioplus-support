name: Final Verify
on: workflow_dispatch
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: All in one query
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref bzodbqioldzdyupzoljx
          supabase db query --linked <<'EOSQL'
          select
            (select count(*) from public.laboratoires) as laboratoires,
            (select count(*) from public.automates) as automates,
            (select count(*) from public.profiles) as profiles,
            (select count(*) from public.tickets) as tickets,
            (select count(*) from auth.users) as auth_users;
          EOSQL
          echo "---"
          supabase db query --linked <<'EOSQL'
          select id, left(description,50) as description, message_erreur, code_erreur, photo_path, priorite, statut from public.tickets;
          EOSQL
