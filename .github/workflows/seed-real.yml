name: Seed Real Tickets
on: workflow_dispatch
jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Seed tickets with real data
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref bzodbqioldzdyupzoljx

          # First get real IDs
          supabase db query --linked <<'EOSQL'
          select 'LABOS' as t, id, nom from public.laboratoires;
          EOSQL
          echo "==="
          supabase db query --linked <<'EOSQL'
          select 'AUTOMATES' as t, id, nom, laboratoire_id from public.automates;
          EOSQL
          echo "==="
          supabase db query --linked <<'EOSQL'
          select 'PROFILES' as t, user_id, role, laboratoire_id from public.profiles;
          EOSQL
