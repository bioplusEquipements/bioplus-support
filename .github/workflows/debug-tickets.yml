name: Debug Tickets
on: workflow_dispatch
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Dump recent tickets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref bzodbqioldzdyupzoljx
          cat > /tmp/q.sql <<'EOSQL'
          select id, left(coalesce(description,'NULL'),60) as description, left(coalesce(message_erreur,'NULL'),40) as msg_err, left(coalesce(code_erreur,'NULL'),20) as code_err, coalesce(photo_path,'NULL') as photo_path, laboratoire_id, automate_id, priorite, statut, technicien_id from public.tickets order by created_at desc limit 5;
          EOSQL
          supabase db query --file /tmp/q.sql --linked
          echo "--- policies tickets ---"
          cat > /tmp/q2.sql <<'EOSQL'
          select policyname, cmd, qual::text from pg_policies where tablename='tickets' and schemaname='public';
          EOSQL
          supabase db query --file /tmp/q2.sql --linked
